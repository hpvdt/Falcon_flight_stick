; PlatformIO Project Configuration File
; Falcon Flight Stick firmware_v2 - STM32F103CBU6

[env:genericSTM32F103CB]
platform = ststm32
board = genericSTM32F103CB
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
; If upload fails with "target voltage too low", power the board from USB first, then connect ST-Link.
; If still failing, try uncommenting the next line to use a slower SWD speed:
; upload_flags = -c "adapter speed 500"